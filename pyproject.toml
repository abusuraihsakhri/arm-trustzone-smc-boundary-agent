[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arm-trustzone-smc-boundary-engine"
version = "2.0.0"
description = "ARM TrustZone Secure Monitor Call (SMC) Interface Auditor"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
arm-trustzone-smc-boundary-engine = "arm_trustzone.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/arm-trustzone-smc-boundary-engine"
Repository = "https://github.com/abusuraihsakhri/arm-trustzone-smc-boundary-engine.git"
